services:

  postgres:
    image: postgis/postgis:17-3.5
    container_name: wandaraya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: wandaraya
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:8
    container_name: wandaraya-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: wandaraya-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant-data:/qdrant/storage
    environment:
      QDRANT__STORAGE__PATH: /qdrant/storage

      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: root
  pgadmin:
    image: dpage/pgadmin4

    container_name: wandaraya-pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@wandaraya.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

  fastapi:

    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile

    container_name: wandaraya-api

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:root@postgres:5432/wandaraya

    volumes:
      - .:/app

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

      qdrant:
        condition: service_started

  airflow:

    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    container_name: wandaraya-airflow

    restart: unless-stopped

    ports:
      - "8081:8080"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:root@postgres:5432/wandaraya
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@airflow-metadata:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/project
      WANDARAYA_PROJECT_ROOT: /opt/airflow/project

    volumes:
      - .:/opt/airflow/project
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      fastapi:
        condition: service_started
      airflow-metadata:
        condition: service_healthy

    command: standalone

  airflow-metadata:
    image: postgres:16
    container_name: wandaraya-airflow-metadata
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:

    image: cgr.dev/chainguard/minio:latest

    container_name: wandaraya-minio

    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

volumes:

  postgres_data:

  redis_data:

  qdrant_data:

  minio_data:

  airflow_metadata_data:
