services:

  postgres:
    image: postgis/postgis:17-3.5
    container_name: wandaraya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: wandaraya
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:8
    container_name: wandaraya-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data

  qdrant:
    # Keep the server pinned to the Python client version for reproducible,
    # warning-free vector indexing.  Do not use `latest` with persisted data.
    image: qdrant/qdrant:v1.18.2
    container_name: wandaraya-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant-snapshots:/qdrant/snapshots
    environment:
      QDRANT__STORAGE__PATH: /qdrant/storage

  # Isolated recovery/rebuild target.  This service never shares a volume,
  # collection, or host port with production Qdrant.  Start it explicitly:
  # docker compose --profile staging up -d qdrant-staging
  qdrant-staging:
    image: qdrant/qdrant:v1.19.1
    container_name: wandaraya-qdrant-staging
    profiles: ["staging"]
    restart: "no"
    ports:
      - "127.0.0.1:6335:6333"
    volumes:
      - qdrant_staging_data:/qdrant/storage
    environment:
      QDRANT__STORAGE__PATH: /qdrant/storage

      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: root
  pgadmin:
    image: dpage/pgadmin4

    container_name: wandaraya-pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@wandaraya.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

  fastapi:

    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile

    container_name: wandaraya-api

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:root@postgres:5432/wandaraya

    volumes:
      - .:/app

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

      qdrant:
        condition: service_started

  # One-off worker for the isolated vector rebuild.  It has no dependency on
  # the production `qdrant` service, so `docker compose run` cannot revive the
  # damaged production collection as a side effect.
  qdrant-staging-worker:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    profiles: ["staging"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:root@postgres:5432/wandaraya
      QDRANT_URL: http://qdrant-staging:6333
      QDRANT_COLLECTION_NAME: sri_lanka_attractions_staging
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant-staging:
        condition: service_started

  # Future cutover target.  It deliberately reuses only the validated staging
  # volume and is profile-gated.  Never run it alongside qdrant-staging.
  qdrant-production-replacement:
    image: qdrant/qdrant:v1.19.1
    container_name: wandaraya-qdrant-replacement
    profiles: ["cutover"]
    restart: unless-stopped
    volumes:
      - qdrant_staging_data:/qdrant/storage
      - ./qdrant-replacement-snapshots:/qdrant/snapshots
    environment:
      QDRANT__STORAGE__PATH: /qdrant/storage

  # Future API replacement.  It keeps port 8000, so the legacy fastapi
  # service must be stopped before an explicitly approved cutover starts.
  fastapi-cutover:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    container_name: wandaraya-api-cutover
    profiles: ["cutover"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:root@postgres:5432/wandaraya
      QDRANT_URL: http://qdrant-production-replacement:6333
      QDRANT_COLLECTION_NAME: sri_lanka_attractions_staging
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant-production-replacement:
        condition: service_started

  airflow:

    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    container_name: wandaraya-airflow

    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:root@postgres:5432/wandaraya
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@airflow-metadata:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/project
      WANDARAYA_PROJECT_ROOT: /opt/airflow/project

    volumes:
      - .:/opt/airflow/project
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      fastapi:
        condition: service_started
      airflow-metadata:
        condition: service_healthy

    command: standalone

  airflow-metadata:
    image: postgres:16
    container_name: wandaraya-airflow-metadata
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:

    image: minio/minio

    container_name: wandaraya-minio

    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

volumes:

  postgres_data:

  redis_data:

  qdrant_data:

  minio_data:

  airflow_metadata_data:

  # Must remain distinct from qdrant_data.  Never mount qdrant-data here.
  qdrant_staging_data:
