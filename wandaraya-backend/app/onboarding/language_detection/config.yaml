# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# Every prediction is logged at INFO with the input text, detected language,
# confidence, and the fallback / short-text / non-text flags.
logging:
  level: INFO
  log_predictions: true
