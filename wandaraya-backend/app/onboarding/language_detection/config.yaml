    - gunawardena

  # Ordinary English function words used by the guard above.
  english_stopwords:
    - the
    - a
    - an
    - and
    - or
    - but
    - if
    - is
    - are
    - was
    - be
    - been
    - am
    - to
    - of
    - in
    - "on"
    - at
    - for
    - with
    - from
    - by
    - i
    - you
    - we
    - he
    - she
    - it
    - they
    - my
    - your
    - our
    - their
    - do
    - does
    - did
    - can
    - could
    - should
    - would
    - will
    - please
